<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Auth Demo</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        /* Quick inline styles for the profile card */
        .profile-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 30px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            margin-top: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .profile-card p {
            text-align: left;
            font-size: 1.1rem;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .profile-card .label {
            font-weight: 700;
            color: #2d3436;
        }
        .profile-card .value {
            color: #4a6cf7;
            float: right;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-left: 10px;
        }
        .badge-verified {
            background: #dcfce7;
            color: #166534;
        }
        .badge-unverified {
            background: #fee2e2;
            color: #b91c1c;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <div id="nav-right">
            <button id="logout-btn-dash">Logout</button>
        </div>
    </nav>

    <h1>Your Dashboard</h1>
    <p>This page is protected. You are successfully authenticated.</p>

    <!-- User Profile Card -->
    <div class="profile-card" id="profile-card">
        <h2 style="margin-bottom: 20px; color: #2d3436;">👤 User Profile</h2>
        <p><span class="label">Email:</span> <span class="value" id="user-email">Loading...</span></p>
        <p><span class="label">User ID:</span> <span class="value" id="user-uid" style="font-size: 0.8rem;">Loading...</span></p>
        <p>
            <span class="label">Email Verified:</span> 
            <span id="user-verified-badge" class="value">Loading...</span>
        </p>
        <p><span class="label">Sign-in Method:</span> <span class="value" id="user-provider">Loading...</span></p>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
