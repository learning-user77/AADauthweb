<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Auth Demo</title> <!-- FIXED: Title -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <nav><a href="index.html">Home</a></nav>
    <div class="auth-container">
        <h2>Sign Up</h2> <!-- FIXED: Heading -->
        <form id="signup-form"> <!-- FIXED: Form ID -->
            <input type="email" id="signup-email" placeholder="Email" required> <!-- FIXED: ID -->
            <input type="password" id="signup-password" placeholder="Password" required> <!-- FIXED: ID -->
            <div id="signup-error" class="error-message"></div> <!-- FIXED: Error div ID -->
            <button type="submit" id="signup-btn">Create Account</button> <!-- FIXED: Button ID -->
        </form>
        <button id="google-login-btn">Sign in with Google</button>
        <p><a href="login.html">Already have an account? Login</a></p>
    </div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
